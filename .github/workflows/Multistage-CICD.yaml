name: Multistage-CICD

on:
  push:
    branches:
      - main

jobs:

  source-security:
    name: Source Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/backend-application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend/backend-application
        run: |
          pytest



  build:
    name: Build and Secure Image
    runs-on: ubuntu-latest
    needs:
      - source-security
      - test
      
    permissions:
      contents: read

    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/myapp-backend
      IMAGE_TAG: ${{ github.sha }}
      IMAGE: ${{ vars.DOCKER_USERNAME }}/myapp-backend:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE" \
            ./backend/backend-application/

      - name: Verify built image
        run: |
          docker image inspect "$IMAGE"

          echo "Built image:"
          docker image ls "$IMAGE_NAME"

      - name: Run Trivy image scan
        run: |
          trivy image \
            "$IMAGE" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-image-results.json \
            --exit-code 0

      - name: Download Trivy HTML template
        if: always()
        run: |
          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o html.tpl

      - name: Generate Trivy HTML report
        if: always()
        run: |
          trivy image \
            "$IMAGE" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format template \
            --template "@html.tpl" \
            --output trivy-image-results.html \
            --exit-code 0

      - name: Upload Trivy HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-image-html-report
          path: trivy-image-results.html
          if-no-files-found: error

      - name: Add Trivy Image Scan summary
        if: always()
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-results.json)

          TOTAL=$((CRITICAL + HIGH))

          {
            echo "## Trivy Image Scan summary"
            echo ""
            echo "**Image:** \`$IMAGE\`"
            echo ""

            if [ "$TOTAL" -eq 0 ]; then
              echo "# No HIGH or CRITICAL vulnerabilities detected ✅"
            else
              echo "# Vulnerabilities detected ❌"
            fi

            echo ""
            echo "| Severity | Count |"
            echo "|---|---:|"
            echo "| 🔴 CRITICAL | $CRITICAL |"
            echo "| 🟠 HIGH | $HIGH |"
            echo "| **TOTAL** | **$TOTAL** |"
            echo ""

            if [ "$TOTAL" -eq 0 ]; then
              echo "**Security gate:** ✅ PASSED"
            else
              echo "**Security gate:** ❌ FAILED"
              echo ""
              echo "The image contains HIGH or CRITICAL vulnerabilities."
            fi
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Enforce Trivy security gate
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-results.json)

          TOTAL=$((CRITICAL + HIGH))

          echo "CRITICAL vulnerabilities: $CRITICAL"
          echo "HIGH vulnerabilities: $HIGH"
          echo "TOTAL vulnerabilities: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "Trivy security gate FAILED."
            exit 1
          fi

          echo "Trivy security gate PASSED."

        
      - name: Generate SBOM
        run: |
          trivy image \
            "$IMAGE" \
            --format spdx-json \
            --output myapp-backend.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: myapp-backend-sbom
          path: myapp-backend.spdx.json
          if-no-files-found: error
          
      - name: Push backend image
        run: |
          docker push "$IMAGE"

      - name: Get pushed image digest
        run: |
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d'@' -f2)

          echo "Image: $IMAGE"
          echo "Image digest: $IMAGE_DIGEST"

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      - name: Verify Cosign installation
        run: |
          cosign version

      - name: Prepare Cosign private key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          printf '%s' "$COSIGN_PRIVATE_KEY" > cosign.key
          chmod 600 cosign.key

          echo "Cosign private key prepared."

      - name: Attest SBOM to image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest \
          --yes \
          --key cosign.key \
          --type spdxjson \
          --predicate myapp-backend.spdx.json \
          "$IMAGE@$IMAGE_DIGEST"

          
      - name: Prepare Cosign public key
        env:
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          printf '%s' "$COSIGN_PUBLIC_KEY" > cosign.pub
          chmod 644 cosign.pub

          
      - name: Verify SBOM attestation
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign verify-attestation \
          --key cosign.pub \
          "$IMAGE@$IMAGE_DIGEST"
          
  image-security:
    name: Image Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/${{ vars.DOCKER_USERNAME }}/myapp-backend:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true


  rhacs-scan:
    name: RHACS Image Scan
    runs-on: ubuntu-latest
    needs: image-security
    permissions:
      contents: read

    env:
      ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
      ROX_ENDPOINT: ${{ vars.ROX_ENDPOINT }}

    steps:
      - name: Install roxctl
        run: |
          curl -L -o roxctl \
            https://mirror.openshift.com/pub/rhacs/assets/4.11.4/bin/Linux/roxctl
          chmod +x roxctl
          sudo mv roxctl /usr/local/bin/roxctl

      - name: RHACS image check
        run: |
          roxctl image check \
            -o table \
            --image="${{ vars.DOCKER_USERNAME }}/myapp-backend:latest"


  deploy:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: rhacs-scan
    permissions:
      contents: read

    env:
      OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}

    steps:
      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Configure OpenShift CA
        run: |
          echo "${{ secrets.OPENSHIFT_CA }}" > openshift-ca.crt

      - name: Log in to OpenShift
        run: |
          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --certificate-authority=openshift-ca.crt

      - name: Update backend image
        run: |
          oc project myapp
          oc set image deployment/backend \
            backend=${{ vars.DOCKER_USERNAME }}/myapp-backend:latest

      - name: Wait for rollout
        run: |
          oc rollout status deployment/backend --timeout=5m
