name: Multistage-CICD

on:
  push:
    branches:
      - main

jobs:

  source-security:
    name: Source Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        id: trivy-fs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate security summary
        if: always()
        run: |
          {
            echo "## Source Security Scan"
            echo ""
            echo "| Security Control | Status |"
            echo "|---|---|"
            echo "| Trivy Filesystem Scan | ${{ steps.trivy-fs.outcome == 'success' && 'PASS' || 'FAIL' }} |"
            echo "| Gitleaks Secret Detection | ${{ steps.gitleaks.outcome == 'success' && 'PASS' || 'FAIL' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
 
  
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/backend-application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html

      - name: Run tests
        id: pytest
        working-directory: backend/backend-application
        run: |
          pytest --html=pytest-report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-html-report
          path: backend/backend-application/pytest-report.html

      - name: Generate test summary
        if: always()
        working-directory: backend/backend-application
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          {
            echo "## Unit Test Summary"
            echo ""
            echo "| Test Control | Status |"
            echo "|---|---|"
            echo "| Unit Tests | ${TEST_OUTCOME^^} |"
            echo "| HTML Test Report | GENERATED |"
            echo ""
            echo "### Test Configuration"
            echo ""
            echo "| Parameter | Configuration |"
            echo "|---|---|"
            echo "| Framework | pytest |"
            echo "| Python Version | 3.12 |"
            echo "| Test Location | backend/backend-application |"
            echo "| Report Format | HTML |"
            echo "| Report Artifact | pytest-html-report |"
          } >> "$GITHUB_STEP_SUMMARY"

  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        id: sonarqube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Generate SonarQube summary
        if: always()
        run: |
          {
            echo "## SonarQube Cloud Analysis"
            echo ""
            echo "| Quality Control | Status |"
            echo "|---|---|"
            echo "| SonarQube Analysis | ${{ steps.sonarqube.outcome == 'success' && 'PASS' || 'FAIL' }} |"
            echo "| Quality Gate | ${{ steps.sonarqube.outcome == 'success' && 'PASS' || 'FAIL' }} |"
            echo ""
            echo "### Analysis Configuration"
            echo ""
            echo "| Parameter | Configuration |"
            echo "|---|---|"
            echo "| Project | AymanKamell_myapp-demo |"
            echo "| Organization | aymankamel |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Analysis Type | Static Code Analysis |"
            echo "| Quality Gate | Sonar way |"
            echo "| Quality Gate Enforcement | Enabled |"
            echo "| Quality Gate Timeout | 300 seconds |"
            echo ""
            echo "### SonarQube Cloud"
            echo ""
            echo "[View SonarQube Project](https://sonarcloud.io/dashboard?id=AymanKamell_myapp-demo&branch=${{ github.ref_name }})"
          } >> "$GITHUB_STEP_SUMMARY"

  build-secure:
    name: Build and Secure Image
    runs-on: ubuntu-latest
    needs:
      - source-security
      - test
      - sonarqube
      
    outputs:
      image-digest: ${{ steps.image-digest.outputs.image-digest }}
      image-ref: ${{ steps.image-digest.outputs.image-ref }}

      
    permissions:
      contents: read

    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/myapp-backend
      IMAGE_TAG: ${{ github.sha }}
      IMAGE: ${{ vars.DOCKER_USERNAME }}/myapp-backend:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE" \
            ./backend/backend-application/

      - name: Verify built image
        run: |
          docker image inspect "$IMAGE"

          echo "Built image:"
          docker image ls "$IMAGE_NAME"

      - name: Run Trivy image scan
        run: |
          trivy image \
            "$IMAGE" \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-image-results.json \
            --exit-code 0

      - name: Download Trivy HTML template
        if: always()
        run: |
          curl -L \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o html.tpl

      - name: Generate Trivy HTML report
        if: always()
        run: |
          trivy convert \
            --format template \
            --template "@html.tpl" \
            --output trivy-image-results.html \
            trivy-image-results.json

      - name: Upload Trivy HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-image-html-report
          path: trivy-image-results.html
          if-no-files-found: error

      - name: Trivy Image Security Report
        if: always()
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-results.json)
          TOTAL=$((CRITICAL + HIGH))

          if [ "$TOTAL" -eq 0 ]; then
            GATE="PASS"
          else
            GATE="FAIL"
          fi

          {
            echo "## Trivy Image Security Report"
            echo ""
            echo "| Metric | Result |"
            echo "|---|---:|"
            echo "| Critical vulnerabilities | $CRITICAL |"
            echo "| High vulnerabilities | $HIGH |"
            echo "| Total findings | $TOTAL |"
            echo "| Security gate | $GATE |"
            echo ""
            echo "### Scan Target"
            echo ""
            echo "- **Image:** \`$IMAGE\`"
            echo "- **Severity:** HIGH, CRITICAL"
            echo "- **Unfixed vulnerabilities:** Ignored"
            echo "- **Report:** Trivy JSON"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Enforce Trivy security gate
        run: |
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-results.json)
          TOTAL=$((CRITICAL + HIGH))

          echo "CRITICAL vulnerabilities: $CRITICAL"
          echo "HIGH vulnerabilities: $HIGH"
          echo "TOTAL vulnerabilities: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "Trivy security gate FAILED."
            exit 1
          fi

          echo "Trivy security gate PASSED."

        
      - name: Generate SBOM
        id: sbom  
        run: |
          trivy image \
            "$IMAGE" \
            --format spdx-json \
            --output myapp-backend.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v5
        with:
          name: myapp-backend-sbom
          path: myapp-backend.spdx.json
          if-no-files-found: error
          
      - name: Push backend image
        run: |
          docker push "$IMAGE"

      - name: Get pushed image digest
        id: image-digest
        run: |
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d'@' -f2)

          echo "Image: $IMAGE"
          echo "Image digest: $IMAGE_DIGEST"

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image-ref=$IMAGE@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      - name: Verify Cosign installation
        run: |
          cosign version

      - name: Prepare Cosign private key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          printf '%s' "$COSIGN_PRIVATE_KEY" > cosign.key
          chmod 600 cosign.key

          echo "Cosign private key prepared."

      - name: Attest SBOM to image
        id: attest
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest \
          --yes \
          --key cosign.key \
          --type spdxjson \
          --predicate myapp-backend.spdx.json \
          "$IMAGE@$IMAGE_DIGEST"

          
      - name: Prepare Cosign public key
        env:
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
        run: |
          printf '%s' "$COSIGN_PUBLIC_KEY" > cosign.pub
          chmod 644 cosign.pub

          
      - name: Verify SBOM attestation
        id: verify_attest
        run: |
          cosign verify-attestation \
          --key cosign.pub \
          --type https://spdx.dev/Document \
          "$IMAGE@$IMAGE_DIGEST"

      - name: Sign image
        id: sign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign \
          --yes \
          --key cosign.key \
          "$IMAGE@$IMAGE_DIGEST"

      - name: Verify image signature
        id: verify_sign
        run: |
          cosign verify \
          --key cosign.pub \
          "$IMAGE@$IMAGE_DIGEST"

      - name: Security Verification Report
        if: always()
        run: |
          status() {
            case "$1" in
              success)   echo "PASS" ;;
              failure)   echo "FAIL" ;;
              skipped)   echo "SKIPPED" ;;
              cancelled) echo "CANCELLED" ;;
              *)         echo "UNKNOWN" ;;
            esac
          }

          {
            echo "## Security Verification Report"
            echo ""
            echo "| Control | Status |"
            echo "|---|---|"
            echo "| SBOM Generation | $(status '${{ steps.sbom.outcome }}') |"
            echo "| SBOM Attestation | $(status '${{ steps.attest.outcome }}') |"
            echo "| Attestation Verification | $(status '${{ steps.verify_attest.outcome }}') |"
            echo "| Image Signing | $(status '${{ steps.sign.outcome }}') |"
            echo "| Signature Verification | $(status '${{ steps.verify_sign.outcome }}') |"
            echo ""
            echo "### Artifact"
            echo ""
            echo "- **Image:** \`$IMAGE\`"
            echo "- **Digest:** \`$IMAGE_DIGEST\`"
            echo "- **SBOM:** SPDX JSON"
            echo "- **Signing:** Cosign"
          } >> "$GITHUB_STEP_SUMMARY"
          

  rhacs-scan:
    name: RHACS Image Scan
    runs-on: ubuntu-latest
    
    needs: build-secure
   
    permissions:
      contents: read

    env:
      ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
      ROX_ENDPOINT: ${{ vars.ROX_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install roxctl
        run: |
          curl -L -o roxctl \
            https://mirror.openshift.com/pub/rhacs/assets/4.11.4/bin/Linux/roxctl
          chmod +x roxctl
          sudo mv roxctl /usr/local/bin/roxctl

      - name: RHACS image check
        run: |
          roxctl image check \
            -o json \
            --image="${{ needs.build-secure.outputs.image-ref }}" \
            > rhacs-policy-check.json

      - name: Inspect RHACS JSON report
        if: always()
        run: |
          echo "===== RHACS JSON REPORT ====="
          jq . rhacs-policy-check.json

      - name: Generate RHACS HTML report
        if: always()
        run: |
          python3 scripts/generate-rhacs-report.py

      - name: Upload RHACS JSON report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rhacs-policy-json
          path: rhacs-policy-check.json
          if-no-files-found: error
      - name: Upload RHACS HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rhacs-policy-html-report
          path: rhacs-policy-check.html
          if-no-files-found: error

          
  deploy:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: rhacs-scan
    permissions:
      contents: read

    env:
      OPENSHIFT_SERVER: ${{ vars.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}

    steps:
      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc kubectl /usr/local/bin/

      - name: Configure OpenShift CA
        run: |
          echo "${{ secrets.OPENSHIFT_CA }}" > openshift-ca.crt

      - name: Log in to OpenShift
        run: |
          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --certificate-authority=openshift-ca.crt

      - name: Update backend image
        run: |
          oc project myapp
          oc set image deployment/backend \
            backend=${{ vars.DOCKER_USERNAME }}/myapp-backend:latest

      - name: Wait for rollout
        run: |
          oc rollout status deployment/backend --timeout=5m
