name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  source-security:
    uses: ./.github/workflows/source-security.yml

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/tests.yml

  sonarqube:
    needs:
      - test
    uses: ./.github/workflows/sonarqube.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

