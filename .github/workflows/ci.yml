name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  source-security:
    uses: ./.github/workflows/source-security.yml

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yaml

  sonarqube:
    uses: ./.github/workflows/sonarqube-updated.yml
    permissions:
      contents: read
      actions: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-secure:
    needs:
      - source-security
      - lint
      - test
      - sonarqube
    uses: ./.github/workflows/build.yaml
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  rhacs-scan:
    needs:
      - build-secure
    uses: ./.github/workflows/rhacs-scan.yml
    with:
      image-ref: ${{ needs.build-secure.outputs.image-ref }}
    secrets:
      ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}

  cosign:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-secure
      - rhacs-scan
    uses: ./.github/workflows/cosign.yml
    with:
      image-ref: ${{ needs.build-secure.outputs.image-ref }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  gitops-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-secure
      - cosign
    uses: ./.github/workflows/gitops-deploy.yml
    with:
      image-digest: ${{ needs.build-secure.outputs.image-digest }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}

  ci-summary:
    name: CI Pipeline Summary
    if: always()
    needs:
      - source-security
      - lint
      - test
      - sonarqube
      - build-secure
      - rhacs-scan
      - cosign
      - gitops-deploy
    uses: ./.github/workflows/ci-summary.yaml
    with:
      source-security-result: ${{ needs.source-security.result }}
      lint-result: ${{ needs.lint.result }}
      test-result: ${{ needs.test.result }}
      sonarqube-result: ${{ needs.sonarqube.result }}
      build-result: ${{ needs.build-secure.result }}
      rhacs-result: ${{ needs.rhacs-scan.result }}
      cosign-result: ${{ needs.cosign.result }}
      gitops-result: ${{ needs.gitops-deploy.result }}
      image-digest: ${{ needs.build-secure.outputs.image-digest }}
      image-ref: ${{ needs.build-secure.outputs.image-ref }}
