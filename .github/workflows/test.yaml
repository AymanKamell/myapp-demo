# Unit Test Workflow
#
# Description:
#   Reusable GitHub Actions workflow for executing the backend unit test
#   suite with pytest. The workflow generates JUnit, HTML, and coverage
#   reports, publishes JUnit results to GitHub Actions using
#   dorny/test-reporter, and preserves the generated reports as workflow
#   artifacts.
#
# Usage:
#   This workflow is intended to be called by another GitHub Actions
#   workflow as a reusable workflow:
#
#     jobs:
#       unit-tests:
#         uses: ./.github/workflows/test.yaml
#
# Outputs:
#   - GitHub Actions test report from JUnit XML results
#   - HTML test report
#   - JUnit XML test results
#   - XML coverage report
#
# Test Location:
#   backend/backend-application

name: Unit Tests

on:
  workflow_call:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/backend-application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html pytest-cov

      - name: Run tests with coverage
        id: pytest
        working-directory: backend/backend-application
        run: |
          pytest \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --html=pytest-report.html \
            --self-contained-html \
            --junitxml=junit.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Test Results
          path: backend/backend-application/junit.xml
          reporter: java-junit

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-html-report
          path: backend/backend-application/pytest-report.html
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-test-results
          path: backend/backend-application/junit.xml
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-coverage
          path: backend/backend-application/coverage.xml
          if-no-files-found: error

      - name: Generate test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          {
            echo "## Unit Test Summary"
            echo ""
            echo "| Test Control | Status |"
            echo "|---|---|"
            echo "| Unit Tests | ${TEST_OUTCOME^^} |"
            echo "| Test Framework | pytest |"
            echo "| Python Version | 3.12 |"
            echo "| Test Location | backend/backend-application |"
            echo "| Coverage Tool | pytest-cov |"
            echo "| Coverage Report | GENERATED |"
            echo "| HTML Test Report | GENERATED |"
            echo "| JUnit Test Results | GENERATED |"

            echo ""
            echo "## Test Artifacts"
            echo ""
            echo "| Artifact | Purpose |"
            echo "|---|---|"
            echo "| pytest-html-report | Detailed HTML test report |"
            echo "| junit-test-results | JUnit XML test results |"
            echo "| python-coverage | XML coverage report |"
          } >> "$GITHUB_STEP_SUMMARY"
