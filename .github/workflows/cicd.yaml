name: MyApp CI/CD

on:
  push:
    branches:
      - main

jobs:

  ci:
    name: CI
    runs-on: ubuntu-latest

    env:
      ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
      ROX_ENDPOINT: ${{ vars.ROX_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/myapp-backend:latest \
            ./backend/backend-application/

      - name: Push backend image
        run: |
          docker push \
            ${{ vars.DOCKER_USERNAME }}/myapp-backend:latest

      - name: Install roxctl
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Install roxctl
        run: |
          curl -L -o roxctl \
            "https://mirror.openshift.com/pub/rhacs/assets/4.11.4/bin/Linux/roxctl"
          chmod +x roxctl
          sudo mv roxctl /usr/local/bin/roxctl

      - name: Verify RHACS connection
        run: |
          roxctl central whoami

      - name: Check image with RHACS
        run: |
          roxctl image check -o table \
            --image="${{ vars.DOCKER_USERNAME }}/myapp-backend:latest"


  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Create OpenShift CA file
        run: |
          printf '%s' '${{ secrets.OPENSHIFT_CA }}' \
            > "$RUNNER_TEMP/openshift-ca.crt"

      - name: Log in to OpenShift
        run: |
          oc login \
            --server="${{ vars.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --certificate-authority="$RUNNER_TEMP/openshift-ca.crt"

      - name: Update backend deployment
        run: |
          oc -n myapp set image deployment/backend \
            backend=docker.io/${{ vars.DOCKER_USERNAME }}/myapp-backend:latest

      - name: Wait for backend rollout
        run: |
          oc -n myapp rollout status deployment/backend
