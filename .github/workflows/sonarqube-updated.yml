name: SonarQube Cloud Analysis

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: AymanKamell_myapp-demo
      SONAR_ORGANIZATION: aymankamel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: python-coverage
          path: backend/backend-application

      - name: Verify coverage report
        run: |
          test -f backend/backend-application/coverage.xml

          echo "Coverage report:"
          ls -lh backend/backend-application/coverage.xml

      - name: SonarQube Scan
        id: sonarqube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Fetch SonarQube metrics
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PULL_REQUEST" ]; then
            curl --fail-with-body \
              --silent \
              --show-error \
              --request GET \
              --url "${SONAR_HOST_URL}/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density,ncloc,complexity,cognitive_complexity&pullRequest=${PULL_REQUEST}" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --output sonar-metrics.json
          else
            curl --fail-with-body \
              --silent \
              --show-error \
              --request GET \
              --url "${SONAR_HOST_URL}/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density,ncloc,complexity,cognitive_complexity" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --output sonar-metrics.json
          fi

      - name: Fetch SonarQube Quality Gate
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PULL_REQUEST" ]; then
            curl --fail-with-body \
              --silent \
              --show-error \
              --request GET \
              --url "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&pullRequest=${PULL_REQUEST}" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --output sonar-quality-gate.json
          else
            curl --fail-with-body \
              --silent \
              --show-error \
              --request GET \
              --url "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}" \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --output sonar-quality-gate.json
          fi

      - name: Generate SonarQube summary
        if: always()
        env:
          ANALYSIS_OUTCOME: ${{ steps.sonarqube.outcome }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os

          analysis_outcome = os.environ.get("ANALYSIS_OUTCOME", "unknown")
          pull_request = os.environ.get("PULL_REQUEST", "")
          source_branch = os.environ.get("SOURCE_BRANCH", "")
          target_branch = os.environ.get("TARGET_BRANCH", "")

          with open("sonar-metrics.json") as f:
              metrics_data = json.load(f)

          with open("sonar-quality-gate.json") as f:
              quality_gate_data = json.load(f)

          measures = {
              item["metric"]: item.get("value", "N/A")
              for item in metrics_data.get("component", {}).get("measures", [])
          }

          quality_gate = quality_gate_data.get("projectStatus", {})

          gate_status = quality_gate.get("status", "UNKNOWN")

          metric_names = {
              "bugs": "Bugs",
              "vulnerabilities": "Vulnerabilities",
              "security_hotspots": "Security Hotspots",
              "code_smells": "Code Smells",
              "coverage": "Coverage",
              "duplicated_lines_density": "Duplicated Lines",
              "ncloc": "Lines of Code",
              "complexity": "Complexity",
              "cognitive_complexity": "Cognitive Complexity",
          }

          print("## SonarQube Cloud Analysis")
          print()

          print("| Quality Control | Status |")
          print("|---|---|")
          print(
              f"| SonarQube Analysis | "
              f"{'PASS' if analysis_outcome == 'success' else 'FAIL'} |"
          )
          print(f"| Quality Gate | {gate_status} |")
          print()

          print("### Code Quality")
          print()
          print("| Metric | Result |")
          print("|---|---:|")

          for key, name in metric_names.items():
              print(f"| {name} | {measures.get(key, 'N/A')} |")

          print()

          print("### Quality Gate Conditions")
          print()
          print("| Condition | Status | Actual | Threshold |")
          print("|---|---|---:|---:|")

          for condition in quality_gate.get("conditions", []):
              metric = condition.get("metricKey", "N/A")
              status = condition.get("status", "N/A")
              actual = condition.get("actualValue", "N/A")
              threshold = condition.get("errorThreshold", "N/A")

              print(
                  f"| {metric} | {status} | "
                  f"{actual} | {threshold} |"
              )

          print()

          print("### Analysis Configuration")
          print()
          print("| Parameter | Configuration |")
          print("|---|---|")
          print(f"| Project | {os.environ.get('SONAR_PROJECT_KEY')} |")
          print(f"| Organization | {os.environ.get('SONAR_ORGANIZATION')} |")

          if pull_request:
              print(f"| Pull Request | #{pull_request} |")
              print(f"| Source Branch | {source_branch} |")
              print(f"| Target Branch | {target_branch} |")
          else:
              print(f"| Branch | {os.environ.get('GITHUB_REF_NAME')} |")

          print("| Analysis Type | Static Code Analysis |")
          print("| Quality Gate | Sonar way |")
          print("| Quality Gate Enforcement | Enabled |")
          print("| Quality Gate Timeout | 300 seconds |")
          PY
