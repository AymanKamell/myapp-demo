name: SonarQube Cloud Analysis

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube analysis
        id: sonarqube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Fetch SonarQube metrics
        id: sonar-metrics
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: AymanKamell_myapp-demo
        run: |
          set -e

          echo "Fetching SonarQube metrics..."

          METRICS="bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density,ncloc,reliability_rating,security_rating,sqale_rating"

          curl -fsS \
            -u "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "component=${SONAR_PROJECT_KEY}" \
            --data-urlencode "metricKeys=${METRICS}" \
            "https://sonarcloud.io/api/measures/component" \
            > sonar-metrics.json

          echo "SonarQube metrics retrieved successfully."

      - name: Fetch SonarQube quality gate
        id: sonar-quality-gate
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: AymanKamell_myapp-demo
        run: |
          set -e

          echo "Fetching SonarQube Quality Gate..."

          curl -fsS \
            -u "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
            "https://sonarcloud.io/api/qualitygates/project_status" \
            > sonar-quality-gate.json

          echo "SonarQube Quality Gate retrieved successfully."

      - name: Generate SonarQube summary
        if: always()
        env:
          SONAR_SCAN_OUTCOME: ${{ steps.sonarqube.outcome }}
        run: |
          if [ -f sonar-metrics.json ]; then

            BUGS=$(jq -r '
              .component.measures[]
              | select(.metric=="bugs")
              | .value // "0"
            ' sonar-metrics.json)

            VULNERABILITIES=$(jq -r '
              .component.measures[]
              | select(.metric=="vulnerabilities")
              | .value // "0"
            ' sonar-metrics.json)

            SECURITY_HOTSPOTS=$(jq -r '
              .component.measures[]
              | select(.metric=="security_hotspots")
              | .value // "0"
            ' sonar-metrics.json)

            CODE_SMELLS=$(jq -r '
              .component.measures[]
              | select(.metric=="code_smells")
              | .value // "0"
            ' sonar-metrics.json)

            COVERAGE=$(jq -r '
              .component.measures[]
              | select(.metric=="coverage")
              | .value // "0"
            ' sonar-metrics.json)

            DUPLICATION=$(jq -r '
              .component.measures[]
              | select(.metric=="duplicated_lines_density")
              | .value // "0"
            ' sonar-metrics.json)

            LOC=$(jq -r '
              .component.measures[]
              | select(.metric=="ncloc")
              | .value // "0"
            ' sonar-metrics.json)

            RELIABILITY=$(jq -r '
              .component.measures[]
              | select(.metric=="reliability_rating")
              | .value // "N/A"
            ' sonar-metrics.json)

            SECURITY=$(jq -r '
              .component.measures[]
              | select(.metric=="security_rating")
              | .value // "N/A"
            ' sonar-metrics.json)

            MAINTAINABILITY=$(jq -r '
              .component.measures[]
              | select(.metric=="sqale_rating")
              | .value // "N/A"
            ' sonar-metrics.json)

          else

            BUGS="N/A"
            VULNERABILITIES="N/A"
            SECURITY_HOTSPOTS="N/A"
            CODE_SMELLS="N/A"
            COVERAGE="N/A"
            DUPLICATION="N/A"
            LOC="N/A"
            RELIABILITY="N/A"
            SECURITY="N/A"
            MAINTAINABILITY="N/A"

          fi

          if [ -f sonar-quality-gate.json ]; then

            QUALITY_GATE=$(jq -r '
              .projectStatus.status // "UNKNOWN"
            ' sonar-quality-gate.json)

          else

            QUALITY_GATE="UNKNOWN"

          fi

          case "$QUALITY_GATE" in
            OK)
              QUALITY_GATE_STATUS="PASS"
              ;;
            ERROR)
              QUALITY_GATE_STATUS="FAIL"
              ;;
            WARN)
              QUALITY_GATE_STATUS="WARN"
              ;;
            *)
              QUALITY_GATE_STATUS="UNKNOWN"
              ;;
          esac

          if [ -f sonar-quality-gate.json ]; then

            QUALITY_GATE_CONDITIONS=$(jq -r '
              .projectStatus.conditions[] |
              [
                .metricKey,
                (.status // "UNKNOWN"),
                (.actualValue // "N/A"),
                (.errorThreshold // "N/A")
              ] |
              @tsv
            ' sonar-quality-gate.json)

          else

            QUALITY_GATE_CONDITIONS=""

          fi

          {
            echo "# SonarQube Cloud Analysis"
            echo ""

            echo "## Analysis Overview"
            echo ""

            echo "| Quality Control | Result |"
            echo "|---|---|"
            echo "| SonarQube Analysis | ${SONAR_SCAN_OUTCOME^^} |"
            echo "| Quality Gate | ${QUALITY_GATE_STATUS} |"
            echo ""

            echo "## SonarQube Results"
            echo ""

            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Bugs | $BUGS |"
            echo "| Vulnerabilities | $VULNERABILITIES |"
            echo "| Security Hotspots | $SECURITY_HOTSPOTS |"
            echo "| Code Smells | $CODE_SMELLS |"
            echo "| Coverage | ${COVERAGE}% |"
            echo "| Duplicated Lines | ${DUPLICATION}% |"
            echo "| Lines of Code | $LOC |"
            echo "| Reliability Rating | $RELIABILITY |"
            echo "| Security Rating | $SECURITY |"
            echo "| Maintainability Rating | $MAINTAINABILITY |"
            echo ""

            echo "## Quality Gate Conditions"
            echo ""

            echo "| Condition | Status | Actual | Threshold |"
            echo "|---|---|---:|---:|"

            if [ -n "$QUALITY_GATE_CONDITIONS" ]; then

              while IFS=$'\t' read -r METRIC STATUS ACTUAL THRESHOLD
              do

                case "$STATUS" in
                  OK)
                    DISPLAY_STATUS="PASS"
                    ;;
                  ERROR)
                    DISPLAY_STATUS="FAIL"
                    ;;
                  WARN)
                    DISPLAY_STATUS="WARN"
                    ;;
                  *)
                    DISPLAY_STATUS="UNKNOWN"
                    ;;
                esac

                case "$METRIC" in
                  coverage)
                    DISPLAY_NAME="Coverage"
                    ACTUAL="${ACTUAL}%"
                    THRESHOLD="${THRESHOLD}%"
                    ;;

                  duplicated_lines_density)
                    DISPLAY_NAME="Duplicated Lines"
                    ACTUAL="${ACTUAL}%"
                    THRESHOLD="${THRESHOLD}%"
                    ;;

                  bugs)
                    DISPLAY_NAME="Bugs"
                    ;;

                  vulnerabilities)
                    DISPLAY_NAME="Vulnerabilities"
                    ;;

                  security_hotspots)
                    DISPLAY_NAME="Security Hotspots"
                    ;;

                  code_smells)
                    DISPLAY_NAME="Code Smells"
                    ;;

                  *)
                    DISPLAY_NAME="$METRIC"
                    ;;
                esac

                echo "| $DISPLAY_NAME | $DISPLAY_STATUS | $ACTUAL | $THRESHOLD |"

              done <<< "$QUALITY_GATE_CONDITIONS"

            else

              echo "| No conditions available | UNKNOWN | N/A | N/A |"

            fi

            echo ""

            echo "## Analysis Configuration"
            echo ""

            echo "| Parameter | Configuration |"
            echo "|---|---|"
            echo "| Project | AymanKamell_myapp-demo |"
            echo "| Organization | aymankamel |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Analysis Type | Static Code Analysis |"
            echo "| Quality Gate | Sonar way |"
            echo "| Quality Gate Enforcement | Enabled |"
            echo "| Quality Gate Timeout | 300 seconds |"
            echo ""

            echo "## SonarQube Cloud"
            echo ""
            echo "[View SonarQube Project](https://sonarcloud.io/dashboard?id=AymanKamell_myapp-demo&branch=${{ github.ref_name }})"

          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw SonarQube results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sonarqube-raw-results
          path: |
            sonar-metrics.json
            sonar-quality-gate.json
          if-no-files-found: ignore
