# Build and Push Image Workflow
# Description:
#   Reusable GitHub Actions workflow for building the backend container image,
#   generating an SPDX SBOM, pushing the image to Docker Hub, and resolving
#   the immutable image digest and reference.
#
# Usage:
#   This workflow is intended to be called by another GitHub Actions workflow
#   as a reusable workflow:
#
#     jobs:
#       build-image:
#         uses: ./.github/workflows/build-image.yaml
#         secrets:
#           DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
#
# Required Repository Configuration:
#   - Repository variable: DOCKER_USERNAME
#   - Repository secret: DOCKER_PASSWORD
#
# Outputs:
#   - image-digest: Immutable digest of the pushed backend image
#   - image-ref: Immutable image reference using the image digest
#
# Image:
#   The image is tagged using the Git commit SHA and pushed to Docker Hub.

name: Build Image

on:
  workflow_call:
    secrets:
      DOCKER_PASSWORD:
        required: true

    outputs:
      image-digest:
        description: "Immutable digest of the pushed backend image"
        value: ${{ jobs.build-image.outputs.image-digest }}

      image-ref:
        description: "Immutable image reference using the image digest"
        value: ${{ jobs.build-image.outputs.image-ref }}

jobs:
  build-image:
    name: Build, Scan and Push Image
    runs-on: ubuntu-latest

    outputs:
      image-digest: ${{ steps.image-digest.outputs.image-digest }}
      image-ref: ${{ steps.image-digest.outputs.image-ref }}

    permissions:
      contents: read

    env:
      IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/myapp-backend
      IMAGE_TAG: ${{ github.sha }}
      IMAGE: ${{ vars.DOCKER_USERNAME }}/myapp-backend:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE" \
            ./backend/backend-application/

      - name: Verify built image
        run: |
          docker image inspect "$IMAGE"

          echo "Built image:"
          docker image ls "$IMAGE_NAME"

      - name: Generate SBOM
        id: sbom
        run: |
          trivy image \
            "$IMAGE" \
            --format spdx-json \
            --output myapp-backend.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: myapp-backend-sbom
          path: myapp-backend.spdx.json
          if-no-files-found: error

      - name: Push backend image
        run: |
          docker push "$IMAGE"

      - name: Get pushed image digest
        id: image-digest
        run: |
          IMAGE_DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "$IMAGE" | cut -d'@' -f2)

          echo "Image: $IMAGE"
          echo "Image digest: $IMAGE_DIGEST"

          echo "image-digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image-ref=$IMAGE@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"


      - name: Generate build summary
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.image-digest.outputs.image-digest }}
          IMAGE_REF: ${{ steps.image-digest.outputs.image-ref }}
          BUILD_OUTCOME: ${{ steps.build-image.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          PUSH_OUTCOME: ${{ steps.push-image.outcome }}
        run: |
          {
            echo "## Build and Image Summary"
            echo ""
            echo "| Control | Status |"
            echo "|---|---|"
            echo "| Container Build | ${BUILD_OUTCOME^^} |"
            echo "| SBOM Generation | ${SBOM_OUTCOME^^} |"
            echo "| Image Push | ${PUSH_OUTCOME^^} |"
            echo ""
            echo "### Image"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Digest | \`${IMAGE_DIGEST:-NOT_AVAILABLE}\` |"
            echo "| Immutable Reference | \`${IMAGE_REF:-NOT_AVAILABLE}\` |"
            echo "| SBOM | SPDX JSON |"
          } >> "$GITHUB_STEP_SUMMARY"
