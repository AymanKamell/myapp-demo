# Description:
#   Reusable workflow that scans the container image with RHACS, evaluates
#   image security policies, and generates vulnerability and policy reports.
#
# Usage:
#   Called by the main CI workflow after the image is built:
#
#     rhacs-scan:
#       needs:
#         - build-secure
#       uses: ./.github/workflows/rhacs-scan.yml
#       with:
#         image-ref: ${{ needs.build-secure.outputs.image-ref }}
#       secrets:
#         ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}

name: RHACS Image Security Scan

on:
  workflow_call:
    inputs:
      image-ref:
        description: "Immutable image reference to scan"
        required: true
        type: string

    secrets:
      ROX_API_TOKEN:
        required: true

jobs:
  rhacs-scan:
    name: RHACS Image Policy Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ROX_API_TOKEN: ${{ secrets.ROX_API_TOKEN }}
      ROX_ENDPOINT: ${{ vars.ROX_ENDPOINT }}
      IMAGE_REF: ${{ inputs.image-ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install roxctl
        run: |
          curl -L \
            -o roxctl \
            https://mirror.openshift.com/pub/rhacs/assets/4.11.4/bin/Linux/roxctl

          chmod +x roxctl
          sudo mv roxctl /usr/local/bin/roxctl

      - name: Verify roxctl installation
        run: |
          roxctl version

      - name: Run RHACS image vulnerability scan
        id: rhacs-scan
        shell: bash
        run: |
          roxctl image scan \
            -o json \
            --image="$IMAGE_REF" \
            > rhacs-image-scan.json

      - name: Run RHACS image policy check
        id: rhacs-check
        shell: bash
        run: |
          roxctl image check \
            -o json \
            --image="$IMAGE_REF" \
            > rhacs-policy-check.json

      - name: Inspect RHACS JSON reports
        if: always()
        shell: bash
        run: |
          echo "===== RHACS IMAGE VULNERABILITY SCAN ====="
          if [ -f rhacs-image-scan.json ]; then
            jq . rhacs-image-scan.json
          else
            echo "RHACS image scan report was not generated."
          fi

          echo ""
          echo "===== RHACS IMAGE POLICY CHECK ====="
          if [ -f rhacs-policy-check.json ]; then
            jq . rhacs-policy-check.json
          else
            echo "RHACS policy check report was not generated."
          fi

      - name: Generate RHACS HTML report
        if: always()
        shell: bash
        run: |
          python3 scripts/generate-rhacs-vulnerability-report.py
          python3 scripts/generate-rhacs-report.py

      - name: Upload RHACS JSON reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rhacs-json-reports
          path: |
            rhacs-image-scan.json
            rhacs-policy-check.json
          if-no-files-found: error

      - name: Upload RHACS HTML reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rhacs-html-reports
          path: |
            rhacs-image-scan.html
            rhacs-policy-check.html
          if-no-files-found: error

      - name: Generate RHACS security summary
        if: always()
        env:
          RHACS_SCAN_OUTCOME: ${{ steps.rhacs-scan.outcome }}
          RHACS_CHECK_OUTCOME: ${{ steps.rhacs-check.outcome }}
        shell: bash
        run: |
          if [ "$RHACS_SCAN_OUTCOME" = "success" ]; then
            SCAN_STATUS="PASS"
          else
            SCAN_STATUS="FAIL"
          fi

          if [ "$RHACS_CHECK_OUTCOME" = "success" ]; then
            CHECK_STATUS="PASS"
          else
            CHECK_STATUS="FAIL"
          fi

          {
            echo "## RHACS Image Security Report"
            echo ""
            echo "| Security Control | Result |"
            echo "|---|---|"
            echo "| RHACS Vulnerability Scan | $SCAN_STATUS |"
            echo "| RHACS Image Policy Check | $CHECK_STATUS |"
            echo ""
            echo "### Scan Target"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE_REF\` |"
            echo "| RHACS Endpoint | \`$ROX_ENDPOINT\` |"
            echo "| Scan Type | Image vulnerability scan |"
            echo "| Check Type | Build-stage policy compliance |"
            echo ""
            echo "### Reports"
            echo ""
            echo "| Report Type | JSON | HTML |"
            echo "|---|---|---|"
            echo "| Vulnerability Scan | \`rhacs-image-scan.json\` | \`rhacs-image-scan.html\` |"
            echo "| Policy Check | \`rhacs-policy-check.json\` | \`rhacs-policy-check.html\` |"
          } >> "$GITHUB_STEP_SUMMARY"
