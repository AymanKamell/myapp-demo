name: MyApp CI/CD

on:
  push:
    branches:
      - main

jobs:

  source-security:
    name: Source Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend/backend-application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend/backend-application
        run: |
          pytest



  build:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs:
      - source-security
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/myapp-backend:latest \
            ./backend/backend-application/

      - name: Push backend image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/myapp-backend:latest


  image-security:
    name: Image Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/${{ vars.DOCKER_USERNAME }}/myapp-backend:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
