name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend image
        run: |
          docker build -t ${{ vars.DOCKER_USERNAME }}/myapp-backend:latest ./backend/backend-application/

      - name: Push backend image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/myapp-backend:latest
      
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Create OpenShift CA file
        run: |
          printf '%s' '${{ secrets.OPENSHIFT_CA }}' > "$RUNNER_TEMP/openshift-ca.crt"

      - name: Log in to OpenShift
        run: |
          oc login \
            --server="${{ vars.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --certificate-authority="$RUNNER_TEMP/openshift-ca.crt"

      - name: Verify OpenShift login
        run: |
          oc whoami
          oc project myapp
